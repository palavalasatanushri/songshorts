name: Deploy SongShorts to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and Build Frontend
        env:
          VITE_SUPABASE_URL: https://tpyjnmzdelmeswplrgop.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRweWpubXpkZWxtZXN3cGxyZ29wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1MTE4NjMsImV4cCI6MjEwNDA4Nzg2M30.aPtQnpDAD9fOc-42XWO2SRkm53asK2BTD0g3DTW3l1k
        run: |
          cd songshorts-frontend
          npm install
          npm run build
          
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './songshorts-frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
